<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理員登入 Admin Login｜安樂窩置業</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f6b4f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E安%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin">
<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="admin.h1"></span></div>
    <h1 data-i18n="admin.h1"></h1>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:420px">
    <form class="panel" id="adminForm">
      <div style="text-align:center;margin-bottom:18px">
        <div style="width:60px;height:60px;border-radius:16px;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-size:28px;margin:0 auto 10px">🔒</div>
        <p class="form-note" data-i18n="admin.note"></p>
      </div>
      <div class="alert info hidden" id="adminFail" data-i18n="admin.fail"></div>
      <div class="form-row" style="margin-bottom:14px"><label data-i18n="admin.user"></label><input name="user" required></div>
      <div class="form-row" style="margin-bottom:18px"><label data-i18n="admin.pass"></label><input type="password" name="pass" required></div>
      <button class="btn btn-primary btn-block" type="submit" data-i18n="admin.login"></button>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
