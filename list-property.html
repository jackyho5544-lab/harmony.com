<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網上放盤 List Property｜安樂窩置業</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f6b4f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E安%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="list">
<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="list.h1"></span></div>
    <h1 data-i18n="list.h1"></h1>
    <p data-i18n="list.sub"></p>
  </div>
</section>

<section class="section">
  <div class="wrap" style="max-width:900px">
    <div class="alert ok hidden" id="listOk">
      <span data-i18n="list.okhint"></span>
      <div id="listOkActions" style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"></div>
    </div>
    <form class="panel" id="listForm">
      <h3 style="color:var(--green-d)" data-i18n="list.owner"></h3>
      <div class="form-grid" style="margin-bottom:22px">
        <div class="form-row"><label data-i18n="list.name"></label><span class="req">*</span><input name="name" required></div>
        <div class="form-row"><label data-i18n="list.phone"></label><span class="req">*</span><input name="phone" required></div>
        <div class="form-row full"><label data-i18n="list.email"></label><input type="email" name="email"></div>
      </div>

      <h3 style="color:var(--green-d)" data-i18n="list.propinfo"></h3>
      <div class="form-grid">
        <div class="form-row"><label data-i18n="list.intent"></label>
          <select name="intent"><option value="sell" data-i18n="list.sell"></option><option value="lease" data-i18n="list.lease"></option></select></div>
        <div class="form-row"><label data-i18n="list.ptype"></label><select name="ptype"></select></div>
        <div class="form-row"><label data-i18n="list.district2"></label><select name="district"></select></div>
        <div class="form-row"><label data-i18n="list.estate2"></label><input name="estate"></div>
        <div class="form-row"><label data-i18n="list.areaf"></label><input type="number" name="area" min="0"></div>
        <div class="form-row"><label data-i18n="list.expect"></label><input name="expect" placeholder="例：680萬 / 1.8萬/月"></div>
        <div class="form-row full"><label data-i18n="list.remark"></label><textarea name="remark"></textarea></div>
        <label class="form-row full" style="flex-direction:row;align-items:center;gap:8px;font-size:14px">
          <input type="checkbox" required style="width:18px;height:18px"><span data-i18n="list.agree"></span>
        </label>
      </div>
      <button class="btn btn-primary" type="submit" style="margin-top:18px" data-i18n="list.submit"></button>
      <p style="font-size:12px;color:var(--muted);margin-top:10px" data-i18n="list.channelnote"></p>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
