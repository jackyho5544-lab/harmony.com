<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樓盤搜尋 Property Search｜安樂窩置業</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f6b4f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E安%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="search">
<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="search.h1"></span></div>
    <h1 data-i18n="search.h1"></h1>
  </div>
</section>

<div class="wrap" style="margin-top:-14px;position:relative;z-index:5">
  <div class="searchbox" id="searchBox">
    <div class="search-tabs">
      <button type="button" data-deal="sale" class="active" data-i18n="s.buy"></button>
      <button type="button" data-deal="rent" data-i18n="s.rent"></button>
    </div>
    <form>
      <div class="search-grid">
        <div class="field"><label data-i18n="s.district"></label><select name="district"></select></div>
        <div class="field"><label data-i18n="s.type"></label><select name="type"></select></div>
        <div class="field field-price"><label data-i18n="s.price"></label><select name="price"></select></div>
        <div class="field field-rent hidden"><label data-i18n="s.rentprice"></label><select name="rent"></select></div>
        <div class="field"><label data-i18n="s.area"></label><select name="area"></select></div>
        <div class="field" style="grid-column:1/-1"><label data-i18n="s.keyword"></label><input name="keyword" data-i18n-ph="s.kwph"></div>
        <div class="search-actions">
          <button type="reset" class="btn btn-ghost" data-i18n="s.reset"></button>
          <button type="submit" class="btn btn-primary" data-i18n="s.search"></button>
        </div>
      </div>
    </form>
  </div>
</div>

<section class="section">
  <div class="wrap">
    <div class="sec-head" style="margin-bottom:12px">
      <div class="count-line" id="resCount" style="margin:0"></div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button class="btn btn-ghost" style="padding:8px 16px;font-size:13.5px" onclick="saveCurrentSearch()">🔔 <span data-i18n="search.save"></span></button>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)">
          <span data-i18n="search.sort"></span>
          <select id="sortSel" style="padding:8px 10px;border:1px solid var(--line);border-radius:9px">
            <option value="new" data-i18n="search.sort.new"></option>
            <option value="pl" data-i18n="search.sort.pl"></option>
            <option value="ph" data-i18n="search.sort.ph"></option>
            <option value="al" data-i18n="search.sort.al"></option>
          </select>
        </label>
      </div>
    </div>
    <div class="saved-box" id="savedBox"></div>
    <div class="grid-cards" id="resGrid"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
