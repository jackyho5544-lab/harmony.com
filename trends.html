<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屋苑走勢 Estate Trends｜安樂窩置業</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f6b4f'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E安%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="trends">
<header class="site-header" id="site-header"></header>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="trends.h1"></span></div>
    <h1 data-i18n="trends.h1"></h1>
    <p data-i18n="trends.sub"></p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div style="margin-bottom:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <label style="font-weight:700;color:var(--muted)" data-i18n="trends.select"></label>
      <select id="estateSel" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:200px"></select>
    </div>
    <div class="stat-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat"><div class="n" id="mAvg">—</div><div class="l" data-i18n="trends.avg"></div></div>
      <div class="stat"><div class="n" id="mChg">—</div><div class="l" data-i18n="trends.chg"></div></div>
      <div class="stat"><div class="n" id="mTxn">—</div><div class="l" data-i18n="trends.txn"></div></div>
    </div>
    <div class="chart-box">
      <canvas id="trendChart" style="width:100%;height:360px"></canvas>
      <div class="chart-legend"><span><i style="background:#0f6b4f"></i><span data-i18n="trends.avg"></span> (HK$/ft)</span></div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
